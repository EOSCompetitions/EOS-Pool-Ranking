<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pool Ladder & Elo Tracker</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #10b981;
            --accent-hover: #059669;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        header {
            text-align: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        h1 { margin: 0 0 8px 0; font-size: 2rem; color: #38bdf8; }
        p { margin: 0; color: var(--text-muted); }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 768px) {
            .grid { grid-template-columns: 1fr 1fr; }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.25rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        label { font-size: 0.875rem; color: var(--text-muted); }

        input, select {
            background-color: #0f172a;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px;
            border-radius: 6px;
            font-size: 1rem;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background-color: var(--accent-hover); }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        th { color: var(--text-muted); font-weight: 600; font-size: 0.875rem; }

        .rank { font-weight: bold; width: 40px; }
        .gain { color: #34d399; font-weight: bold; }
        .loss { color: #f87171; font-weight: bold; }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 250px;
            overflow-y: auto;
        }

        .history-item {
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎱 Pool League Elo Tracker</h1>
        <p>Rankings update automatically with a maximum 50-point transfer per game.</p>
    </header>

    <div class="grid">
        <!-- Add Player & Match Logger -->
        <div style="display: flex; flex-direction: column; gap: 24px;">
            <div class="card">
                <h2>Add New Player</h2>
                <form id="add-player-form">
                    <div class="form-group">
                        <label for="player-name">Player Name</label>
                        <input type="text" id="player-name" placeholder="e.g. John Doe" required>
                    </div>
                    <button type="submit">Add Player</button>
                </form>
            </div>

            <div class="card">
                <h2>Record Match Result</h2>
                <form id="record-match-form">
                    <div class="form-group">
                        <label for="winner-select">Winner</label>
                        <select id="winner-select" required></select>
                    </div>
                    <div class="form-group">
                        <label for="loser-select">Loser</label>
                        <select id="loser-select" required></select>
                    </div>
                    <button type="submit">Submit Result</button>
                </form>
            </div>
        </div>

        <!-- Leaderboard -->
        <div class="card">
            <h2>Leaderboard</h2>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Player</th>
                        <th>Points</th>
                        <th>W/L</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body"></tbody>
            </table>
        </div>
    </div>

    <!-- Match History -->
    <div class="card">
        <h2>Recent Matches</h2>
        <ul id="history-list" class="history-list"></ul>
    </div>
</div>

<script>
    const K_FACTOR = 50;
    const INITIAL_RATING = 1000;

    // Load state from local storage or set defaults
    let players = JSON.parse(localStorage.getItem('pool_players')) || [
        { id: '1', name: 'Alice', rating: 1200, wins: 0, losses: 0 },
        { id: '2', name: 'Bob', rating: 1150, wins: 0, losses: 0 },
        { id: '3', name: 'Charlie', rating: 1000, wins: 0, losses: 0 }
    ];

    let matches = JSON.parse(localStorage.getItem('pool_matches')) || [];

    function saveData() {
        localStorage.setItem('pool_players', JSON.stringify(players));
        localStorage.setItem('pool_matches', JSON.stringify(matches));
    }

    // Calculate Elo change
    function calculateEloChange(winnerRating, loserRating) {
        // Expected outcome for the winner (between 0 and 1)
        const expectedWinner = 1 / (1 + Math.pow(10, (loserRating - winnerRating) / 400));
        // Winner score is 1, so points gained = K * (1 - expected)
        const pointChange = Math.round(K_FACTOR * (1 - expectedWinner));
        return Math.max(1, Math.min(K_FACTOR, pointChange)); // Clamp between 1 and 50
    }

    function render() {
        // Sort players by rating descending
        players.sort((a, b) => b.rating - a.rating);

        // Render Leaderboard
        const leaderboardBody = document.getElementById('leaderboard-body');
        leaderboardBody.innerHTML = players.map((player, index) => `
            <tr>
                <td class="rank">${index + 1}</td>
                <td><strong>${escapeHtml(player.name)}</strong></td>
                <td>${player.rating}</td>
                <td>${player.wins
